<!doctype html>
<!-- Share card: the masthead, the drug-class key and the tab mark. Laid out at 1200 x 630 (CARD_W, CARD_H in tools/share.py match); copies index.html's masthead, class key and colours; the mark is icon.svg. Redraw with `python3 tools/share.py`. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&family=Public+Sans:wght@400;600&family=DM+Mono:wght@500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff}
.c{box-sizing:border-box;width:1200px;height:630px;padding:64px 72px 56px;display:flex;flex-direction:column;justify-content:space-between;font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;color:#3b3537}
.mid{display:flex;align-items:center;justify-content:space-between;gap:48px}
h1{margin:0;font:800 128px/.92 'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif;letter-spacing:-.04em;color:#161214}
h1 span{color:#c8102e}
.dek{margin:26px 0 0;font-size:30px;line-height:1.3;color:#161214;max-width:700px}
.key{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:30px;font:600 20px 'Public Sans','Helvetica Neue',Arial,sans-serif;color:#3b3537}
.key i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:9px;vertical-align:-1px}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e7e2e3;padding-top:18px;font:500 17px 'DM Mono',Menlo,monospace;color:#625a5c}
.foot b{font-weight:500;color:#161214;background:#fff2a8;padding:1px 8px;border-radius:3px}
</style>
<div class="c">
  <div class="mid">
    <div>
      <h1>Overdose <span>Watch</span></h1>
      <p class="dek">Overdose deaths and new drugs in the Bay Area, California and Nevada.</p>
      <div class="key"><span><i style="background:#c8102e"></i>Fentanyls</span><span><i style="background:#b37903"></i>Orphines</span><span><i style="background:#4983e5"></i>Nitazenes</span><span><i style="background:#0f8f6c"></i>Benzos</span><span><i style="background:#0e5e8a"></i>Animal sedatives</span></div>
    </div>
    <img src="icon.svg" width="230" height="230" alt="">
  </div>
  <div class="foot"><span>Official counts and sourced reports · <b>updated every Monday</b></span><span>kat-titter.github.io/overdose-watch</span></div>
</div>
